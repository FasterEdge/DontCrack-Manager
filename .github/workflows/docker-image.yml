name: 'Docker 镜像构建'
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published, released]
permissions:
  contents: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: 'Go 单元测试'
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: '运行测试'
      run: go test ./...
    - name: '静态检查 go vet'
      run: go vet ./...
    - name: '构建 Docker 镜像'
      run: |
        docker build -t dontcrack-manager .
    - name: '导出并上传镜像工件'
      run: |
        docker save dontcrack-manager | gzip > dontcrack-manager-image.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        # 不能用 github.ref_name: Dependabot PR 分支名含 '/' 会使 artifact name 非法导致上传失败
        name: 'dontcrack-manager-docker-image-${{ github.run_id }}'
        path: 'dontcrack-manager-image.tar.gz'
        if-no-files-found: 'warn'
        retention-days: 14
    - name: '上传镜像包到 Release'
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        files: 'dontcrack-manager-image.tar.gz'
        fail_on_unmatched_files: false
