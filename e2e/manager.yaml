# 完整体联调配置: 3 个服务, 每个由一个真实 DontCrack 实例监管。
#
# 路径说明: 二进制路径用 ${E2E_BIN} 占位(可执行扩展名后缀 ${EXT}), 由 e2e_test.sh
# 用 envsubst 渲染成实际路径 —— 硬编码 /e2e/bin 只适用于 docker 布局,
# 会让 CI checkout 布局无法直接跑。脚本总会导出这两个变量, 因此本文件不应被直接传给 -config。
log_level: info
listen: 127.0.0.1:11899          # DontCrack-Manager 聚合状态端口(避开各实例端口)
dontcrack_binary: ${E2E_BIN}/dontcrack${EXT}
shutdown_grace: 10s

services:
  # db: 常驻子进程(childproc normal), 无探针
  - name: db
    path: ${E2E_BIN}/childproc${EXT}
    args: "-mode normal -interval 5s -message db"
    port: 11883
    start_now: true
    restart: always
    backoff: 1s
    backoff_max: 10s

  # web: 依赖 db; 带 HTTP 探针, 验证依赖顺序 + 探针健康判定
  - name: web
    path: ${E2E_BIN}/tinyhttp${EXT}
    args: "-addr :9090"
    port: 11884
    start_now: true
    depends_on: [db]
    depend_timeout: 20s
    probe_cmd: "wget -q -O /dev/null http://127.0.0.1:9090/healthz"
    probe_interval: 3
    probe_timeout: 2
    probe_failure_limit: 2
    restart: on-failure
    backoff: 1s
    backoff_max: 10s

  # worker: 周期性崩溃(lifetime 6s, exit 42), 由 DontCrack auto-restart 无限重启;
  # state-file 跨重启计数, 验证 DontCrack 层子进程自动重启。
  - name: worker
    path: ${E2E_BIN}/childproc${EXT}
    args: "-mode crash -lifetime 6s -interval 3s -state-file ${WORKER_STATE} -message worker"
    port: 11885
    auto_restart: true
    max_retries: -1
    start_now: true
    restart: always
    backoff: 1s
    backoff_max: 10s
